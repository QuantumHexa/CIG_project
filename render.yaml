# Render Blueprint — deploy at https://dashboard.render.com/select-repo?type=blueprint
# Connect GitHub repo QuantumHexa/CIG_project and apply this blueprint.

databases:
  - name: cig-db
    plan: free
    databaseName: eventmedia
    user: eventmedia

services:
  - type: web
    name: cig-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run build && npm run deploy:setup
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cig-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        sync: false
      - key: PORT
        value: "10000"
